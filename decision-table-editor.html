<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ディシジョンテーブル エディタ</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }

        /* ── Header ──────────────────────────────────── */
        .app-header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 20px 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .app-header h1 { font-size: 22px; font-weight: 700; }
        .app-header p  { font-size: 13px; opacity: 0.85; margin-top: 6px; line-height: 1.6; }

        /* ── Layout ──────────────────────────────────── */
        .main { padding: 24px; }

        /* ── Buttons ─────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: opacity .15s, transform .1s;
            white-space: nowrap;
        }
        .btn:hover  { opacity: .88; }
        .btn:active { transform: scale(.97); }
        .btn-blue  { background: #2563eb; color: #fff; }
        .btn-white { background: #fff; color: #374151; border: 1px solid #d1d5db; }
        .btn-green { background: #16a34a; color: #fff; }
        .btn-red   { background: #ef4444; color: #fff; }

        /* ── Toolbar ─────────────────────────────────── */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar-tip { font-size: 12px; color: #6b7280; margin-left: auto; }

        /* ── Table card ──────────────────────────────── */
        .table-wrap {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
            overflow-x: auto;
        }

        table { border-collapse: collapse; width: 100%; min-width: max-content; }

        /* Header row */
        thead tr { border-bottom: 2px solid #e5e7eb; }
        th { padding: 0; font-weight: 600; font-size: 13px; }

        .th-num {
            width: 44px;
            text-align: center;
            color: #9ca3af;
            font-size: 11px;
            padding: 12px 0;
            background: #fafafa;
        }
        th.th-condition {
            background: #eff6ff;
            min-width: 190px;
            border-left: 1px solid #e5e7eb;
            position: relative;
            overflow: visible;
        }
        .th-cond-inner {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 6px;
        }
        .th-cond-inner input {
            flex: 1;
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 13px;
            color: #1d4ed8;
            outline: none;
            min-width: 80px;
        }
        .th-cond-inner input::placeholder { color: #93c5fd; font-weight: 400; }

        th.th-result {
            background: #f0fdf4;
            min-width: 190px;
            border-left: 2px solid #d1fae5;
        }
        .th-result-inner {
            display: flex;
            align-items: center;
            padding: 10px 12px;
        }
        .th-result-inner span { font-weight: 700; font-size: 13px; color: #15803d; }

        th.th-del { width: 40px; background: #fafafa; }

        /* Body rows */
        tbody tr { border-bottom: 1px solid #f3f4f6; }
        tbody tr:last-child { border-bottom: none; }

        td.td-num {
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            background: #fafafa;
            width: 44px;
            padding: 4px 0;
            position: relative;
            overflow: visible;
        }
        /* Row insert buttons — sit on the horizontal border */
        .row-ins-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563eb;
            color: #fff;
            border: 2px solid #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 14px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s;
            z-index: 20;
            padding: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,.25);
        }
        .row-ins-before { top: -9px; }
        .row-ins-after  { bottom: -9px; }
        tr:hover .row-ins-btn { opacity: 1; }
        .row-ins-btn:hover { background: #1d4ed8; opacity: 1 !important; }
        td.td-condition {
            border-left: 1px solid #e5e7eb;
            padding: 6px 8px;
            vertical-align: middle;
        }
        td.td-result {
            border-left: 2px solid #d1fae5;
            padding: 6px 8px;
            vertical-align: middle;
        }
        td.td-result input {
            width: 100%;
            border: 1.5px solid transparent;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 13px;
            background: transparent;
            color: #166534;
            font-weight: 500;
            outline: none;
            transition: border-color .15s, background .15s;
        }
        td.td-result input:focus { border-color: #86efac; background: #f0fdf4; }
        td.td-result input::placeholder { color: #bbf7d0; font-weight: 400; }

        td.td-del { text-align: center; padding: 0; background: #fafafa; }

        /* Condition chip */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            min-height: 32px;
            transition: background .1s;
        }
        .chip.filled {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 500;
        }
        .chip.filled:hover { background: #bfdbfe; }
        .chip.empty {
            background: transparent;
            color: #d1d5db;
            font-style: italic;
            font-size: 12px;
            border: 1.5px dashed #e5e7eb;
        }
        .chip.empty:hover { background: #f0f9ff; border-color: #93c5fd; color: #93c5fd; }
        .chip-op { font-weight: 700; font-size: 15px; }

        /* Delete buttons */
        .del-col-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #93c5fd;
            font-size: 14px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 700;
            transition: color .15s, background .15s;
            line-height: 1;
        }
        .del-col-btn:hover { color: #ef4444; background: #fee2e2; }

        /* Column insert buttons — sit on the vertical border */
        .col-ins-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563eb;
            color: #fff;
            border: 2px solid #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 14px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s;
            z-index: 20;
            padding: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,.25);
        }
        .col-ins-left  { left: -9px; }
        .col-ins-right { right: -9px; }
        th.th-condition:hover .col-ins-btn { opacity: 1; }
        .col-ins-btn:hover { background: #1d4ed8; opacity: 1 !important; }

        .del-row-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #d1d5db;
            font-size: 16px;
            padding: 6px 10px;
            transition: color .15s;
            line-height: 1;
        }
        .del-row-btn:hover { color: #ef4444; }

        /* Matched row highlight */
        tbody tr.matched td { background: #fef9c3 !important; }
        tbody tr.matched td.td-result { background: #fde68a !important; }

        /* ── Cell Editor Popup ────────────────────────── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.15);
            z-index: 200;
            display: none;
        }
        .overlay.open { display: block; }

        .cell-editor {
            position: fixed;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.1);
            padding: 18px 20px;
            width: 288px;
            z-index: 201;
            display: none;
        }
        .cell-editor.open { display: block; }

        .ed-title {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f3f4f6;
        }
        .ed-field { margin-bottom: 12px; }
        .ed-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 6px;
        }
        .ed-field select, .ed-field input {
            width: 100%;
            padding: 9px 10px;
            border: 1.5px solid #e5e7eb;
            border-radius: 7px;
            font-size: 13px;
            outline: none;
            color: #1f2937;
            background: #fff;
            transition: border-color .15s;
        }
        .ed-field select:focus, .ed-field input:focus { border-color: #3b82f6; }
        .ed-actions { display: flex; gap: 8px; margin-top: 14px; }
        .ed-actions .btn { flex: 1; justify-content: center; }

        /* ── Evaluation Panel ────────────────────────── */
        .eval-panel {
            margin-top: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
            padding: 20px 24px;
        }
        .eval-head { margin-bottom: 16px; }
        .eval-head h2 { font-size: 16px; font-weight: 700; color: #1f2937; }
        .eval-head p  { font-size: 12px; color: #9ca3af; margin-top: 3px; }

        .eval-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 16px;
        }
        .eval-field { display: flex; flex-direction: column; gap: 5px; }
        .eval-field label { font-size: 12px; font-weight: 600; color: #374151; }
        .eval-field input {
            padding: 8px 12px;
            border: 1.5px solid #e5e7eb;
            border-radius: 7px;
            font-size: 13px;
            width: 160px;
            outline: none;
            transition: border-color .15s;
        }
        .eval-field input:focus { border-color: #3b82f6; }

        .eval-actions { display: flex; gap: 10px; margin-bottom: 14px; }

        .eval-result {
            padding: 14px 18px;
            border-radius: 8px;
            display: none;
        }
        .eval-result.show { display: block; }
        .eval-result.ok   { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .eval-result.ng   { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .eval-result-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; opacity: .7; margin-bottom: 4px; }
        .eval-result-value { font-size: 18px; font-weight: 700; }

        /* ── JSON Panel ──────────────────────────────── */
        .json-panel {
            margin-top: 16px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            overflow: hidden;
        }
        .json-toggle {
            width: 100%;
            padding: 14px 20px;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .json-toggle:hover { background: #f9fafb; }
        .json-arrow { transition: transform .2s; display: inline-block; }
        .json-arrow.open { transform: rotate(180deg); }

        .json-body { padding: 0 20px 20px; display: none; }
        .json-body.open { display: block; }
        .json-body textarea {
            width: 100%;
            height: 180px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            border: 1.5px solid #e5e7eb;
            border-radius: 7px;
            padding: 10px 12px;
            resize: vertical;
            outline: none;
            line-height: 1.5;
        }
        .json-body textarea:focus { border-color: #3b82f6; }
        .json-actions { display: flex; gap: 8px; margin-top: 10px; }

        /* ── Footer note ─────────────────────────────── */
        .help-note {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="app-header">
    <h1>ディシジョンテーブル エディタ</h1>
    <p>
        条件列を追加して各行にルールを定義します。セルをクリックして条件（演算子と値）を設定してください。<br>
        空のセルは「すべての値に一致」として扱われます。行は上から順に評価され、最初に一致した行の結果が採用されます。
    </p>
</div>

<div class="main">

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="btn btn-blue"  onclick="addConditionCol()">＋ 条件列を追加</button>
        <button class="btn btn-white" onclick="addRowHandler()">＋ 行を追加</button>
        <span class="toolbar-tip">💡 条件セルをクリックして演算子と値を設定します</span>
    </div>

    <!-- Table -->
    <div class="table-wrap">
        <table id="dt"></table>
    </div>

    <p class="help-note">
        ※ 空のセル＝条件なし（任意の値に一致）&nbsp;&nbsp;
        ※ 行は上から優先度順に評価されます&nbsp;&nbsp;
        ※ 演算子：＝（等しい）、＜（未満）、≤（以下）、＞（超過）、≥（以上）
    </p>

    <!-- Evaluation Panel -->
    <div class="eval-panel">
        <div class="eval-head">
            <h2>値を評価する</h2>
            <p>各条件に値を入力して、どのルールが適用されるか確認できます</p>
        </div>
        <div class="eval-fields" id="eval-fields"></div>
        <div class="eval-actions">
            <button class="btn btn-green" onclick="runEval()">▶ 評価する</button>
            <button class="btn btn-white" onclick="clearEval()">クリア</button>
        </div>
        <div class="eval-result" id="eval-result">
            <div class="eval-result-label" id="eval-label"></div>
            <div class="eval-result-value" id="eval-value"></div>
        </div>
    </div>

    <!-- JSON Panel -->
    <div class="json-panel">
        <button class="json-toggle" onclick="toggleJson(this)">
            <span>JSON でエクスポート / インポート</span>
            <span class="json-arrow">▾</span>
        </button>
        <div class="json-body" id="json-body">
            <textarea id="json-area" placeholder="ここにJSONが表示されます..."></textarea>
            <div class="json-actions">
                <button class="btn btn-white" onclick="exportJson()">エクスポート</button>
                <button class="btn btn-blue"  onclick="importJson()">インポート</button>
            </div>
        </div>
    </div>

</div>

<!-- Cell Editor -->
<div class="overlay" id="overlay" onclick="closeEditor()"></div>
<div class="cell-editor" id="cell-editor">
    <div class="ed-title" id="ed-title">条件を設定</div>
    <div class="ed-field">
        <label>演算子</label>
        <select id="ed-op">
            <option value="">(条件なし — 任意の値に一致)</option>
            <option value="=">=　等しい</option>
            <option value="<">&lt;　より小さい（未満）</option>
            <option value="<=">&le;　以下</option>
            <option value=">">&gt;　より大きい（超過）</option>
            <option value=">=">&ge;　以上</option>
        </select>
    </div>
    <div class="ed-field">
        <label>値</label>
        <input type="text" id="ed-val" placeholder="数値 / 文字列 / true / false" />
    </div>
    <div class="ed-actions">
        <button class="btn btn-blue"  onclick="applyEditor()">適用</button>
        <button class="btn btn-white" onclick="clearCellEditor()">クリア</button>
        <button class="btn btn-white" onclick="closeEditor()">キャンセル</button>
    </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────

const S = {
    cols:  [],   // [{ id, name }]
    rows:  [],   // [{ id, cells: { [colId]: { op, val } }, result }]
    nCol: 1,
    nRow: 1,
};

// ─── Column & Row Operations ──────────────────────────────────────────────────

function mkCol(name) {
    const col = { id: 'c' + S.nCol++, name: name ?? ('条件 ' + (S.cols.length + 1)) };
    S.cols.push(col);
    return col;
}

function mkRow() {
    const row = { id: 'r' + S.nRow++, cells: {}, result: '' };
    S.rows.push(row);
    return row;
}

function addConditionCol() { mkCol(); render(); }
function addRowHandler()   { mkRow(); render(); }

function removeCol(colId) {
    if (S.cols.length <= 1) { alert('条件列は最低1つ必要です'); return; }
    if (!confirm('この条件列をすべての行から削除しますか？')) return;
    S.cols = S.cols.filter(c => c.id !== colId);
    S.rows.forEach(r => delete r.cells[colId]);
    render();
}

function removeRow(rowId) {
    S.rows = S.rows.filter(r => r.id !== rowId);
    render();
}

function insertRowAt(rowId, position) {
    const idx = S.rows.findIndex(r => r.id === rowId);
    if (idx === -1) return;
    const newRow = { id: 'r' + S.nRow++, cells: {}, result: '' };
    S.rows.splice(position === 'before' ? idx : idx + 1, 0, newRow);
    render();
}

function insertColAt(colId, position) {
    const idx = S.cols.findIndex(c => c.id === colId);
    if (idx === -1) return;
    const newCol = { id: 'c' + S.nCol++, name: '条件 ' + (S.cols.length + 1) };
    S.cols.splice(position === 'before' ? idx : idx + 1, 0, newCol);
    render();
}

// ─── Render ───────────────────────────────────────────────────────────────────

function render() {
    const table = document.getElementById('dt');

    // ── Header
    let h = '<thead><tr>';
    h += '<th class="th-num">#</th>';

    S.cols.forEach(col => {
        h += `<th class="th-condition">
            <button class="col-ins-btn col-ins-left" onclick="insertColAt('${col.id}','before')" title="左に列を挿入">＋</button>
            <div class="th-cond-inner">
                <input type="text" value="${x(col.name)}" placeholder="列名"
                    data-colid="${col.id}"
                    oninput="onColName(this)" onchange="onColName(this)" />
                <button class="del-col-btn" onclick="removeCol('${col.id}')" title="この列を削除">×</button>
            </div>
            <button class="col-ins-btn col-ins-right" onclick="insertColAt('${col.id}','after')" title="右に列を挿入">＋</button>
        </th>`;
    });

    h += `<th class="th-result">
        <div class="th-result-inner"><span>結果（終端ノード）</span></div>
    </th>`;
    h += '<th class="th-del"></th>';
    h += '</tr></thead>';

    // ── Body
    h += '<tbody>';
    S.rows.forEach((row, idx) => {
        h += `<tr id="tr-${row.id}">`;
        h += `<td class="td-num">
            <button class="row-ins-btn row-ins-before" onclick="insertRowAt('${row.id}','before')" title="上に行を挿入">＋</button>
            ${idx + 1}
            <button class="row-ins-btn row-ins-after" onclick="insertRowAt('${row.id}','after')" title="下に行を挿入">＋</button>
        </td>`;

        S.cols.forEach(col => {
            const cell = row.cells[col.id];
            if (cell) {
                h += `<td class="td-condition">
                    <div class="chip filled" onclick="openEditor('${row.id}','${col.id}',event)">
                        <span class="chip-op">${sym(cell.op)}</span><span>${x(cell.val)}</span>
                    </div>
                </td>`;
            } else {
                h += `<td class="td-condition">
                    <div class="chip empty" onclick="openEditor('${row.id}','${col.id}',event)">任意の値</div>
                </td>`;
            }
        });

        h += `<td class="td-result">
            <input type="text" value="${x(row.result)}" placeholder="結果の値を入力..."
                data-rowid="${row.id}" oninput="onResult(this)" onchange="onResult(this)" />
        </td>`;
        h += `<td class="td-del">
            <button class="del-row-btn" onclick="removeRow('${row.id}')" title="この行を削除">✕</button>
        </td>`;
        h += '</tr>';
    });
    h += '</tbody>';

    table.innerHTML = h;
    renderEvalFields();
}

function onColName(input) {
    const col = S.cols.find(c => c.id === input.dataset.colid);
    if (col) { col.name = input.value; renderEvalFields(); }
}

function onResult(input) {
    const row = S.rows.find(r => r.id === input.dataset.rowid);
    if (row) row.result = input.value;
}

function sym(op) {
    return { '=': '=', '<': '<', '<=': '≤', '>': '>', '>=': '≥' }[op] || op;
}

function x(s) {
    return (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Cell Editor ──────────────────────────────────────────────────────────────

let edTarget = null; // { rowId, colId }

function openEditor(rowId, colId, ev) {
    edTarget = { rowId, colId };
    const col  = S.cols.find(c => c.id === colId);
    const row  = S.rows.find(r => r.id === rowId);
    const cell = row?.cells[colId];

    document.getElementById('ed-title').textContent =
        col ? `「${col.name}」の条件を設定` : '条件を設定';
    document.getElementById('ed-op').value  = cell?.op  ?? '';
    document.getElementById('ed-val').value = cell?.val ?? '';

    // Position near the clicked cell
    const td   = ev.target.closest('td');
    const rect = td.getBoundingClientRect();
    const W = 288, H = 228;
    let top  = rect.bottom + 6;
    let left = rect.left;
    if (top  + H > window.innerHeight) top  = rect.top - H - 6;
    if (left + W > window.innerWidth)  left = window.innerWidth - W - 12;
    if (left < 8) left = 8;
    if (top  < 8) top  = 8;

    const ed = document.getElementById('cell-editor');
    ed.style.top  = top  + 'px';
    ed.style.left = left + 'px';
    ed.classList.add('open');
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('ed-val').focus(), 40);
}

function applyEditor() {
    if (!edTarget) return;
    const op  = document.getElementById('ed-op').value;
    const val = document.getElementById('ed-val').value;
    const row = S.rows.find(r => r.id === edTarget.rowId);
    if (row) {
        if (op) {
            row.cells[edTarget.colId] = { op, val };
        } else {
            delete row.cells[edTarget.colId];
        }
    }
    closeEditor();
    render();
}

function clearCellEditor() {
    if (!edTarget) return;
    const row = S.rows.find(r => r.id === edTarget.rowId);
    if (row) delete row.cells[edTarget.colId];
    closeEditor();
    render();
}

function closeEditor() {
    document.getElementById('cell-editor').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    edTarget = null;
}

document.getElementById('ed-val').addEventListener('keydown', e => {
    if (e.key === 'Enter')  applyEditor();
    if (e.key === 'Escape') closeEditor();
});

// ─── Evaluation ───────────────────────────────────────────────────────────────

function renderEvalFields() {
    const cont = document.getElementById('eval-fields');
    const prev = {};
    cont.querySelectorAll('input[data-evalcol]').forEach(el => {
        prev[el.dataset.evalcol] = el.value;
    });
    cont.innerHTML = S.cols.map(col => `
        <div class="eval-field">
            <label>${x(col.name)}</label>
            <input type="text" data-evalcol="${col.id}"
                placeholder="値を入力"
                value="${x(prev[col.id] || '')}" />
        </div>`).join('');
}

function coerce(s) {
    if (s == null) return '';
    if (s === 'true')  return true;
    if (s === 'false') return false;
    const n = Number(s);
    if (typeof s === 'string' && s.trim() !== '' && !isNaN(n)) return n;
    return s;
}

function matches(cell, rawInput) {
    if (!cell || !cell.op) return true; // wildcard
    if (rawInput == null) return true;  // 未入力はワイルドカード扱い
    const a = coerce(rawInput);
    const b = coerce(cell.val);
    switch (cell.op) {
        case '=':  return a == b;
        case '<':  return a  < b;
        case '<=': return a <= b;
        case '>':  return a  > b;
        case '>=': return a >= b;
    }
    return false;
}

function runEval() {
    const inputs = {};
    document.querySelectorAll('#eval-fields input[data-evalcol]').forEach(el => {
        inputs[el.dataset.evalcol] = el.value;
    });

    // Clear previous highlight
    document.querySelectorAll('tbody tr.matched').forEach(tr => tr.classList.remove('matched'));

    // Find first matching row
    let found = null;
    for (const row of S.rows) {
        if (S.cols.every(col => matches(row.cells[col.id], inputs[col.id] ?? ''))) {
            found = row;
            break;
        }
    }

    const el    = document.getElementById('eval-result');
    const label = document.getElementById('eval-label');
    const value = document.getElementById('eval-value');
    el.classList.add('show');

    if (found) {
        const tr = document.getElementById('tr-' + found.id);
        if (tr) tr.classList.add('matched');
        el.className  = 'eval-result show ok';
        label.textContent = '一致 → 結果';
        value.textContent = found.result || '(結果が未設定です)';
    } else {
        el.className  = 'eval-result show ng';
        label.textContent = '不一致';
        value.textContent = 'どのルールにも一致しませんでした';
    }
}

function clearEval() {
    document.querySelectorAll('#eval-fields input').forEach(el => el.value = '');
    document.querySelectorAll('tbody tr.matched').forEach(tr => tr.classList.remove('matched'));
    const el = document.getElementById('eval-result');
    el.className = 'eval-result';
}

// ─── JSON ─────────────────────────────────────────────────────────────────────

function toggleJson(btn) {
    document.getElementById('json-body').classList.toggle('open');
    btn.querySelector('.json-arrow').classList.toggle('open');
}

function exportJson() {
    document.getElementById('json-area').value = JSON.stringify(
        { cols: S.cols, rows: S.rows }, null, 2);
}

function importJson() {
    try {
        const d = JSON.parse(document.getElementById('json-area').value);
        if (!Array.isArray(d.cols) || !Array.isArray(d.rows)) throw new Error('cols, rows が必要です');
        S.cols = d.cols;
        S.rows = d.rows;
        const colNums = S.cols.map(c => parseInt(c.id.replace('c','')) || 0);
        const rowNums = S.rows.map(r => parseInt(r.id.replace('r','')) || 0);
        S.nCol = (colNums.length ? Math.max(...colNums) : 0) + 1;
        S.nRow = (rowNums.length ? Math.max(...rowNums) : 0) + 1;
        render();
        alert('インポートが完了しました');
    } catch (e) {
        alert('JSONの解析に失敗しました:\n' + e.message);
    }
}
