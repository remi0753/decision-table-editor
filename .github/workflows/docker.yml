name: Docker image (leverie-mcp)

# Builds the leverie-mcp Docker image and pushes to GHCR.
#
# Tag policy:
#   - push to `main` touching mcp-server / packages / Dockerfile / this workflow:
#       ghcr.io/<owner>/leverie-mcp:main, :sha-<short-sha>, :edge
#   - push of a git tag matching `leverie-mcp-v*.*.*`:
#       ghcr.io/<owner>/leverie-mcp:<full-semver>, :<major.minor>, :<major>, :latest
#   - manual `workflow_dispatch`: :manual + :sha-<short-sha>
#
# Pull-request builds run the image but do **not** push (no secrets in PR runs).
#
# Single-arch (linux/amd64) per P1.4 scope. Multi-arch can be added later by
# enabling QEMU + adjusting the `platforms:` input.

on:
  push:
    branches: [main]
    tags: ["leverie-mcp-v*.*.*"]
    paths:
      - "apps/mcp-server/**"
      - "packages/engine/**"
      - "packages/schema/**"
      - "packages/checks/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "apps/mcp-server/**"
      - "packages/engine/**"
      - "packages/schema/**"
      - "packages/checks/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/leverie-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `leverie-mcp-v1.2.3` -> 1.2.3 / 1.2 / 1 / latest
          tags: |
            type=match,pattern=leverie-mcp-v(.*),group=1
            type=match,pattern=leverie-mcp-v(\d+\.\d+)\..*,group=1
            type=match,pattern=leverie-mcp-v(\d+)\..*,group=1
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/leverie-mcp-v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp-server/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
