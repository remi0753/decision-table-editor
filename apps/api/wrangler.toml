name = "leverie-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Workers Routes (production): leverie.dev/api/* and /v1/* → this Worker.
# See [design_p3_infrastructure.md §3.2] for the path-based origin rationale.
# /api/* is the browser surface (cookie session, CSRF gate); /v1/* is the
# external Bearer-authenticated API added in P4.2. Both share the same Worker
# but diverge their middleware (see apps/api/src/index.ts).
# Routes are configured per environment below; preview / prod target different
# zones so dev iteration doesn't touch the production hostname.

[dev]
port = 8787
local_protocol = "http"

# Non-secret env vars (shared across all environments unless overridden).
# In local dev, BETTER_AUTH_URL points at the editor's Vite origin so the
# Set-Cookie response from the email-verification redirect is scoped to the
# same host that the SPA later calls /api/* on. The actual Worker still
# listens on :8787 — Vite proxies /api/* through to it.
[vars]
BETTER_AUTH_URL = "http://localhost:5173"
CORS_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# ──────────────────────────────────────────────────────────────────────────
# Preview environment (branch deploys + manual smoke testing)
# ──────────────────────────────────────────────────────────────────────────
[env.preview]
name = "leverie-api-preview"
routes = [
  { pattern = "preview.leverie.dev/api/*", zone_name = "leverie.dev" },
  { pattern = "preview.leverie.dev/v1/*", zone_name = "leverie.dev" },
]

[env.preview.vars]
BETTER_AUTH_URL = "https://preview.leverie.dev"
# Same-origin path-based API needs no cross-origin callers by default. If the
# api.leverie.dev fallback is exercised, set this to the SPA origins that may
# send credentialed requests.
CORS_ALLOWED_ORIGINS = ""

# Backs Better Auth's rate-limit counters. Provision with:
#   wrangler kv namespace create RATE_LIMIT_KV --env preview
# then replace the id below with the value returned.
[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# ──────────────────────────────────────────────────────────────────────────
# Production environment
# ──────────────────────────────────────────────────────────────────────────
[env.prod]
name = "leverie-api"
routes = [
  { pattern = "leverie.dev/api/*", zone_name = "leverie.dev" },
  { pattern = "leverie.dev/v1/*", zone_name = "leverie.dev" },
]

[env.prod.vars]
BETTER_AUTH_URL = "https://leverie.dev"
CORS_ALLOWED_ORIGINS = ""
EMAIL_FROM = "LEVERIE <auth@leverie.dev>"

[[env.prod.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c00a51a75cb347ed8582d285d05b9f7e"

# ──────────────────────────────────────────────────────────────────────────
# Cron Triggers — see [design_p3_infrastructure.md §2.5] for the job list.
# The hourly trigger drives runScheduledMaintenance() which physically purges
# abandoned sign-up rows so an attacker cannot squat on email addresses by
# flooding /sign-up/email with random mailboxes.
# ──────────────────────────────────────────────────────────────────────────
[triggers]
crons = [
  "0 * * * *",  # unverified user + expired verification sweep (hourly)
]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false