<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LEVERIE decision table editor preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="0.56" stop-color="#eef2ff" />
      <stop offset="1" stop-color="#fdf4ff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#312e81" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="58" y="58" width="1084" height="514" rx="28" fill="#ffffff" filter="url(#softShadow)" />
  <rect x="58" y="58" width="1084" height="84" rx="28" fill="#111827" />
  <rect x="58" y="114" width="1084" height="28" fill="#111827" />

  <circle cx="105" cy="100" r="11" fill="#ef4444" />
  <circle cx="140" cy="100" r="11" fill="#f59e0b" />
  <circle cx="175" cy="100" r="11" fill="#22c55e" />
  <text x="600" y="109" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" text-anchor="middle">LEVERIE</text>

  <text x="112" y="216" fill="#581c87" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="4">LEVERIE</text>
  <text x="112" y="286" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">Decision tables</text>
  <text x="112" y="348" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">for AI agents</text>
  <text x="112" y="414" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="500">Build deterministic decision tools</text>
  <text x="112" y="452" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="500">in tables, not code.</text>

  <g transform="translate(640 190)">
    <rect width="440" height="286" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <rect width="440" height="58" rx="18" fill="url(#accent)" />
    <text x="24" y="38" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800">Loan review</text>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">
      <text x="28" y="96" fill="#334155">Risk</text>
      <text x="164" y="96" fill="#334155">Income</text>
      <text x="310" y="96" fill="#334155">Decision</text>
    </g>
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="24" y1="116" x2="416" y2="116" />
      <line x1="24" y1="166" x2="416" y2="166" />
      <line x1="24" y1="216" x2="416" y2="216" />
      <line x1="144" y1="76" x2="144" y2="260" />
      <line x1="288" y1="76" x2="288" y2="260" />
    </g>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">
      <text x="28" y="148" fill="#0f172a">low</text>
      <text x="164" y="148" fill="#0f172a">&gt; 80k</text>
      <text x="310" y="148" fill="#047857">approve</text>
      <text x="28" y="198" fill="#0f172a">mid</text>
      <text x="164" y="198" fill="#0f172a">&gt; 50k</text>
      <text x="310" y="198" fill="#0369a1">review</text>
      <text x="28" y="248" fill="#0f172a">high</text>
      <text x="164" y="248" fill="#0f172a">any</text>
      <text x="310" y="248" fill="#be123c">reject</text>
    </g>
  </g>
</svg>
